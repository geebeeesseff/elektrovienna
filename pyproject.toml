[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elektro-vienna"
version = "0.1.0"
description = "Read-only Gmail inventory and immutable source archiving for Elektro Vienna"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth[requests]>=2.38,<3",
    "google-auth-oauthlib>=1.2,<2",
    "requests>=2.30,<3",
    "oauthlib>=3.2,<5",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]
pilot = ["pypdf>=6.10,<7"]

[project.scripts]
elektro-vienna = "elektro_vienna.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elektro_vienna = ["review.css", "review.js", "review_live.js"]
